<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DualDrill C# shader compiler</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      body {
        box-sizing: border-box;
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }

      canvas {
        display: block;
        width: 800px;
        aspect-ratio: 4 / 3;
        max-width: 100%;
        height: auto;
        background: #073642;
        border: 1px solid #475569;
      }

      .shader-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      button {
        padding: 8px 12px;
        color: inherit;
        background: #1e293b;
        border: 1px solid #64748b;
        border-radius: 4px;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        background: #0e7490;
        border-color: #67e8f9;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      pre {
        overflow: auto;
        padding: 12px;
        background: #020617;
        border: 1px solid #334155;
        white-space: pre-wrap;
      }

      .error {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <h1>C# compiler → WebGPU shaders</h1>
    <div class="shader-buttons" role="group" aria-label="Shader selection">
      <button
        type="button"
        data-shader="MinimumTriangleShader"
        aria-pressed="true"
      >
        Triangle
      </button>
      <button
        type="button"
        data-shader="SimpleStructUniformShaderModule"
        aria-pressed="false"
      >
        Uniform
      </button>
      <button
        type="button"
        data-shader="MandelbrotDistanceShaderModule"
        aria-pressed="false"
      >
        Mandelbrot
      </button>
      <button
        type="button"
        data-shader="RaymarchingPrimitiveShader"
        aria-pressed="false"
      >
        Raymarching
      </button>
    </div>
    <p id="status" aria-live="polite">Starting…</p>
    <canvas id="shader-canvas" width="800" height="600"></canvas>

    <h2>Adapter</h2>
    <pre id="adapter">Not requested yet.</pre>

    <h2>Diagnostics</h2>
    <pre id="diagnostics">Waiting for generated WGSL.</pre>

    <h2>Generated WGSL</h2>
    <pre id="wgsl">Waiting for compiler response.</pre>

    <script type="module" src="/js/compiler.js"></script>
  </body>
</html>
