<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DualDrill CPU WebRTC proof of concept</title>
  <style>
    body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font: 1rem system-ui, sans-serif; }
    video { display: block; width: min(100%, 640px); aspect-ratio: 4 / 3; margin: 1rem 0; background: #111; }
    button { margin-right: .5rem; padding: .5rem 1rem; }
    #status { min-height: 1.5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Managed BGRA → GStreamer → WebRTC</h1>
  <p>Local-only, one browser at a time. The moving white square is generated by C#.</p>
  <video id="video" autoplay playsinline muted></video>
  <button id="start" type="button">Start</button>
  <button id="stop" type="button" disabled>Stop</button>
  <p id="status" role="status" aria-live="polite">Stopped.</p>

  <script>
    const video = document.querySelector("#video");
    const status = document.querySelector("#status");
    const start = document.querySelector("#start");
    const stop = document.querySelector("#stop");
    let peer = null;
    let socket = null;
    let pendingCandidates = [];

    function setStatus(message) {
      status.textContent = message;
    }

    async function applyCandidate(candidate) {
      if (!peer.remoteDescription) {
        pendingCandidates.push(candidate);
        return;
      }
      await peer.addIceCandidate(candidate);
    }

    async function handleSignal(event) {
      const signal = JSON.parse(event.data);

      if (signal.type === "offer") {
        if (peer.remoteDescription) {
          throw new Error("Received a second offer.");
        }

        await peer.setRemoteDescription({ type: "offer", sdp: signal.sdp });

        for (const candidate of pendingCandidates) {
          await peer.addIceCandidate(candidate);
        }
        pendingCandidates = [];

        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);
        socket.send(JSON.stringify({ type: "answer", sdp: peer.localDescription.sdp }));
        setStatus("Answer sent; connecting media…");
        return;
      }

      if (signal.type === "ice") {
        await applyCandidate({
          candidate: signal.candidate,
          sdpMLineIndex: signal.sdpMLineIndex
        });
        return;
      }

      if (signal.type === "status") {
        setStatus(signal.message);
        return;
      }

      if (signal.type === "error") {
        throw new Error(signal.message);
      }

      throw new Error(`Unknown server signal: ${signal.type}`);
    }

    function stopSession(message = "Stopped.") {
      socket?.close();
      peer?.close();
      socket = null;
      peer = null;
      pendingCandidates = [];
      video.srcObject = null;
      start.disabled = false;
      stop.disabled = true;
      setStatus(message);
    }

    start.addEventListener("click", () => {
      start.disabled = true;
      stop.disabled = false;
      setStatus("Opening signaling socket…");

      peer = new RTCPeerConnection();
      socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);

      peer.onicecandidate = event => {
        if (event.candidate &&
            event.candidate.sdpMLineIndex !== null &&
            socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "ice",
            sdpMLineIndex: event.candidate.sdpMLineIndex,
            candidate: event.candidate.candidate
          }));
        }
      };

      peer.ontrack = event => {
        video.srcObject = event.streams[0] ?? new MediaStream([event.track]);
        setStatus("Receiving video.");
      };

      peer.onconnectionstatechange = () => {
        if (peer && ["failed", "disconnected", "closed"].includes(peer.connectionState)) {
          stopSession(`Peer connection ${peer.connectionState}.`);
        }
      };

      socket.onopen = () => setStatus("Waiting for server offer…");
      socket.onmessage = event => handleSignal(event).catch(error => stopSession(`Error: ${error.message}`));
      socket.onerror = () => stopSession("WebSocket failed (the single viewer slot may be occupied).");
      socket.onclose = () => {
        if (socket) {
          stopSession("Server disconnected.");
        }
      };
    });

    stop.addEventListener("click", () => stopSession());
  </script>
</body>
</html>
