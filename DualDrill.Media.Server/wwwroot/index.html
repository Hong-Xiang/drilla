<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DualDrill GPU WebRTC proof of concept</title>
    <style>
      body {
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font:
          1rem system-ui,
          sans-serif;
      }
      video {
        display: block;
        width: min(100%, 640px);
        aspect-ratio: 4 / 3;
        margin: 1rem 0;
        background: #111;
      }
      button {
        margin-right: 0.5rem;
        padding: 0.5rem 1rem;
      }
      #status {
        min-height: 1.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>GPU → BGRA readback → GStreamer → WebRTC</h1>
    <p>
      Local-only, one browser at a time. A rotating triangle is rendered by
      wgpu-native on the server GPU and streamed through GStreamer.
    </p>
    <video id="video" autoplay playsinline muted></video>
    <button id="start" type="button">Start</button>
    <button id="stop" type="button" disabled>Stop</button>
    <p id="status" role="status" aria-live="polite">Stopped.</p>

    <script type="module" src="/client.js"></script>
  </body>
</html>
